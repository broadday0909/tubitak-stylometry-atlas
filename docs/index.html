<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TÜBİTAK Stilometri Atlası | Bayram Akpamukçu</title>
    
    <!-- Meta Açıklamaları & SEO -->
    <meta name="description" content="TÜBİTAK Evrensel İngiliz Dili ve Edebiyatı Stilometri Atlası: Chaucer'dan Modernizm'e 7 Edebi Dönem, 37 Kanonik Yazar, Çift Katmanlı Sınıflandırma ve Burrows' Delta Motoru. Developed by Bayram Akpamukçu.">
    <meta name="author" content="Bayram Akpamukçu">
    <meta name="keywords" content="Stilometri, TÜBİTAK, Computational Literary Studies, İngiliz Edebiyatı, Bayram Akpamukçu, Makine Öğrenmesi, Doğal Dil İşleme">
    
    <!-- OpenGraph & Sosyal Medya Kartları -->
    <meta property="og:title" content="TÜBİTAK Stilometri Atlası | Bayram Akpamukçu">
    <meta property="og:description" content="Kanonik İngiliz Edebiyatı Çift Katmanlı Stilometri ve Adli Metin Analiz Platformu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bayramakpamukcu.site">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, #1e3a8a 0%, #0f172a 75%, #020617 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.1s ease;
            backdrop-filter: blur(8px);
        }
        #loading-overlay.fade-out {
            opacity: 0;
            transform: scale(1.04);
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 36px 42px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(56, 189, 248, 0.1);
            backdrop-filter: blur(16px);
            max-width: 90vw;
            animation: floatUp 1.2s ease-out;
        }

        @keyframes floatUp {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero-icon {
            font-size: 3.4rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.4));
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.3)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 26px rgba(56, 189, 248, 0.6)); }
        }

        .title {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 0.96rem;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 400;
            max-width: 480px;
            line-height: 1.5;
        }

        /* Zarif Pürüzsüz İlerleme Çubuğu (Smooth Ambient Line) */
        .progress-line-container {
            width: 220px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 22px;
            position: relative;
        }
        .progress-line {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
            animation: shimmer 1.8s infinite ease-in-out;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Künye Rozetleri */
        .credits-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .primary-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #7dd3fc;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 20px;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.15);
        }
        .contributors-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .contrib-label {
            font-size: 0.72rem;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .contrib-pill {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #7dd3fc;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 16px;
        }
        #app-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh + 42px);
            border: none;
            display: block;
            background: #ffffff;
            transition: filter 0.3s ease;
        }

        /* Sağ Üst Sabit Karanlık Mod Butonu */
        #theme-toggle-btn {
            position: fixed;
            top: 14px;
            right: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            color: #0f172a;
            border: 1.5px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            user-select: none;
            transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
        }
        #theme-toggle-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
        }
        #theme-toggle-btn:active {
            transform: scale(0.95);
        }

        /* Karanlık Mod Aktif Olduğunda (Tüm sayfayı ve iframe'i anında 0ms karanlık yapar) */
        html.dark-theme, body.dark-theme {
            background-color: #0b0f19 !important;
        }
        html.dark-theme #theme-toggle-btn {
            background: #1e293b;
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.7);
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.4);
        }
        html.dark-theme #app-frame {
            filter: invert(0.92) hue-rotate(180deg) brightness(0.98) contrast(1.02);
            background: #0b0f19;
        }
    </style>
</head>
<body>
    <button id="theme-toggle-btn" title="Karanlık / Aydınlık Mod" aria-label="Karanlık Mod">🌙</button>

    <div id="loading-overlay">
        <div class="welcome-card">
            <div class="hero-icon">🏛️</div>
            <div class="title">TÜBİTAK Stilometri Atlası</div>
            <div class="subtitle">Evrensel İngiliz Dili ve Edebiyatı Hesaplamalı Analiz & Üslup Haritası</div>
            
            <div class="progress-line-container">
                <div class="progress-line"></div>
            </div>

            <div class="credits-container">
                <div class="primary-badge">✨ Developed by Bayram Akpamukçu</div>
                <div class="contributors-row">
                    <span class="contrib-label">with contributions from</span>
                    <span class="contrib-pill">🤝 Mustafa Tunç</span>
                    <span class="contrib-pill">🤝 Yasir Tanrıverdi</span>
                </div>
            </div>
        </div>
    </div>

    <iframe 
        id="app-frame" 
        src="https://tubitak-stylometry-atlas.streamlit.app/?embed=true"
        allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

    <script>
        const iframe = document.getElementById('app-frame');
        const overlay = document.getElementById('loading-overlay');
        const themeBtn = document.getElementById('theme-toggle-btn');

        // Kayıtlı tema tercihini yükle
        const savedTheme = localStorage.getItem('atlas_theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.body.classList.add('dark-theme');
            themeBtn.textContent = '☀️';
        }

        // Tıklanınca anında (0ms) karanlık/aydınlık mod geçişi yap
        themeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const isDark = document.documentElement.classList.toggle('dark-theme');
            document.body.classList.toggle('dark-theme', isDark);
            themeBtn.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('atlas_theme', isDark ? 'dark' : 'light');
        });

        // URL parametresiyle özel Streamlit hedefi belirtilmişse kullan (örn: ?target=https://...)
        const urlParams = new URLSearchParams(window.location.search);
        const customTarget = urlParams.get('app') || urlParams.get('target');
        if (customTarget) {
            iframe.src = customTarget.includes('?') ? customTarget + '&embed=true' : customTarget + '?embed=true';
        }

        // Karşılama ekranını pürüzsüz ve kademeli şekilde kapat
        function dismissWelcome() {
            if (overlay && !overlay.classList.contains('fade-out')) {
                overlay.classList.add('fade-out');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1200);
            }
        }

        // Iframe yüklendiğinde zarif geçiş yap
        iframe.onload = function() {
            setTimeout(dismissWelcome, 700);
        };

        // En geç 4.5 saniye sonra pürüzsüz geçişi sağla
        setTimeout(dismissWelcome, 4500);
    </script>
</body>
</html>
