<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TÜBİTAK Stilometri Atlası | Bayram Akpamukçu</title>
    
    <!-- Meta Açıklamaları & SEO -->
    <meta name="description" content="TÜBİTAK Evrensel İngiliz Dili ve Edebiyatı Stilometri Atlası: Chaucer'dan Modernizm'e 7 Edebi Dönem, 37 Kanonik Yazar, Çift Katmanlı Sınıflandırma ve Burrows' Delta Motoru. Developed by Bayram Akpamukçu.">
    <meta name="author" content="Bayram Akpamukçu">
    <meta name="keywords" content="Stilometri, TÜBİTAK, Computational Literary Studies, İngiliz Edebiyatı, Bayram Akpamukçu, Makine Öğrenmesi, Doğal Dil İşleme">
    
    <!-- OpenGraph & Sosyal Medya Kartları -->
    <meta property="og:title" content="TÜBİTAK Stilometri Atlası | Bayram Akpamukçu">
    <meta property="og:description" content="Kanonik İngiliz Edebiyatı Çift Katmanlı Stilometri ve Adli Metin Analiz Platformu">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bayramakpamukcu.site">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #ffffff;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #93c5fd;
            margin-bottom: 12px;
            text-align: center;
        }
        .badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
        }
        #app-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="title">🏛️ TÜBİTAK: Stilometri Atlası</div>
        <div class="subtitle">Evrensel İngiliz Dili ve Edebiyatı Hesaplamalı Analiz Motoru</div>
        <div class="badge">Developed by Bayram Akpamukçu</div>
    </div>

    <iframe 
        id="app-frame" 
        src="https://tubitak-stylometry-atlas.streamlit.app/?embed=true"
        allow="accelerometer; autoplay; camera; clipboard-read; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; payment; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>

    <script>
        const iframe = document.getElementById('app-frame');
        const overlay = document.getElementById('loading-overlay');

        // URL parametresiyle özel Streamlit hedefi belirtilmişse kullan (örn: ?target=https://...)
        const urlParams = new URLSearchParams(window.location.search);
        const customTarget = urlParams.get('app') || urlParams.get('target');
        if (customTarget) {
            iframe.src = customTarget.includes('?') ? customTarget + '&embed=true' : customTarget + '?embed=true';
        }

        // Iframe yüklendiğinde yükleme ekranını gizle
        iframe.onload = function() {
            setTimeout(() => {
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
            }, 600);
        };

        // Ağ yavaşlığı durumunda en geç 5 saniye sonra yükleme ekranını kaldır
        setTimeout(() => {
            if (overlay.style.visibility !== 'hidden') {
                overlay.style.opacity = '0';
                overlay.style.visibility = 'hidden';
            }
        }, 5000);
    </script>
</body>
</html>
